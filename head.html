<meta
  http-equiv="Content-Security-Policy"
  content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
  move-to-http-header="true"
>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script nonce="aem" type="module">
  if (new URL(window.location.href).searchParams.get('dapreview')) {
    const { default: daPreview } = await import('https://da.live/scripts/dapreview.js');
    window.__daPreview = daPreview;
    window.dispatchEvent(new CustomEvent('dapreview-ready', { detail: { daPreview } }));
  }
</script>
<script nonce="aem" src="/scripts/aem.js" type="module"></script>
<script nonce="aem" src="/scripts/scripts.js" type="module"></script>
<link rel="stylesheet" href="/styles/styles.css"/>
